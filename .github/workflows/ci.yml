name: CI

on:
  push:
    branches: [ main, "feat/*", "fix/*", "stage*" ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Nushell
        uses: hustcer/setup-nu@v3
        with:
          version: '0.116.1'

      - name: Setup Just
        uses: extractions/setup-just@v4

      - name: Verify tools
        run: |
          nu --version
          just --version

      - name: Run test suite
        run: just test

      - name: Verify core purity
        shell: nu {0}
        run: |
          let forbidden = ['/home/[a-z0-9_-]+/', '/data/projects', 'C:\\Users\\', '\bchezmoi\b', '\bsops\b']
          let files = (glob "src/**/*.nu" | append (glob "bin/**/*.nu"))
          mut found_violations = []
          for f in $files {
            let content = (open --raw $f | str lowercase)
            for pattern in $forbidden {
              if ($content =~ ($pattern | str lowercase)) {
                $found_violations = ($found_violations | append $"($f) matches forbidden pattern '($pattern)'")
              }
            }
          }
          if not ($found_violations | is-empty) {
            print -e ($found_violations | str join "\n")
            exit 1
          }
          print "Core purity verified: src/ and bin/ are clean."

      - name: Verify generated nu completions
        shell: nu {0}
        run: |
          let out = (mktemp --tmpdir ygg-completions-XXXXXX.nu)
          ^nu bin/ygg.nu completions nu | save --force $out
          ^nu -c $"source '($out)'"
          rm --force $out
          print "nu completions: syntax OK"
