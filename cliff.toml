# git-cliff config: CHANGELOG.md is generated from conventional commits.
# Regenerate before tagging a release: `mise run changelog`.
# Issue references come from the commit footer (`Fixes #12`, `Closes #12`, `Refs #12`).

[changelog]
header = """
# Changelog

All notable changes to `ygg`. Generated by [git-cliff](https://git-cliff.org) from conventional commits.\n
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}\
{% for footer in commit.footers %}{% if footer.token in ["Fixes", "Closes", "Refs"] %} ([#{{ footer.value | trim_start_matches(pat="#") }}](https://github.com/gidragir/ygg/issues/{{ footer.value | trim_start_matches(pat="#") }})){% endif %}{% endfor %}\
{% endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^ci", group = "<!-- 5 -->CI" },
  { message = "^chore\\(context-init\\)", skip = true },
  { message = "^test", skip = true },
  { message = "^chore", skip = true },
  { message = "^Merge", skip = true },
]
